name: Create Release from setup.py

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip, setuptools, packaging and install git-cliff
        run: |
          python -m pip install --upgrade pip setuptools packaging
          pip install git-cliff

      - name: Extract version from setup.py
        id: get_version
        run: |
          VERSION=$(python setup.py --version)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest release tag
        id: get_last_release
        run: |
          latest=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name // "v0.0.0"' | sed 's/^v//')
          echo "LATEST_RELEASE=$latest" >> $GITHUB_ENV

      - name: Check release version
        run: |
          echo "New version: ${{ steps.get_version.outputs.VERSION }}"
          echo "Latest release: $LATEST_RELEASE"
          python - <<EOF
          from packaging.version import parse

          new_version = parse("${{ steps.get_version.outputs.VERSION }}")
          latest_version = parse("$LATEST_RELEASE")

          if new_version <= latest_version:
              raise SystemExit(f"Error: New version ({new_version}) is not higher than latest release ({latest_version})")
          EOF

      - name: Generate release notes and update CHANGELOG.md
        run: |
          git-cliff --unreleased --strip all --tag "v${{ steps.get_version.outputs.VERSION }}" > RELEASE_NOTES.md
          git-cliff --unreleased --tag "v${{ steps.get_version.outputs.VERSION }}" --prepend CHANGELOG.md

      - name: Open CHANGELOG.md PR and wait for merge
        id: changelog_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          BRANCH="chore/changelog-v${VERSION}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for v${VERSION}"
          git push origin "$BRANCH"

          # main is a protected branch (requires a PR), so open one instead
          # of pushing directly, and try to auto-merge it.
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update CHANGELOG.md for v${VERSION}" \
            --body "Automated CHANGELOG.md update for the v${VERSION} release.")
          echo "PR_URL=$PR_URL"

          # Requires "Allow auto-merge" enabled on the repo. If main also
          # requires human approval, this queues the merge but won't force it.
          gh pr merge "$PR_URL" --squash --auto || true

          echo "Waiting for $PR_URL to merge (up to 15 minutes)..."
          MERGED=false
          for i in $(seq 1 60); do
            STATE=$(gh pr view "$PR_URL" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              MERGED=true
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "::error::PR was closed without merging: $PR_URL"
              exit 1
            fi
            sleep 15
          done

          if [ "$MERGED" != "true" ]; then
            echo "::error::Timed out waiting for the CHANGELOG.md PR to merge. It may need manual approval/merge: $PR_URL"
            exit 1
          fi

          MERGE_SHA=$(gh pr view "$PR_URL" --json mergeCommit -q .mergeCommit.oid)
          echo "MERGE_SHA=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          git tag v${{ steps.get_version.outputs.VERSION }} ${{ steps.changelog_pr.outputs.MERGE_SHA }}
          git push origin v${{ steps.get_version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-dev:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge main into a sync branch off dev
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin main dev
          git checkout -b sync/main-into-dev-${{ github.run_id }} origin/dev
          git merge origin/main --no-edit

      - name: Push sync branch
        run: git push origin sync/main-into-dev-${{ github.run_id }}

      - name: Open PR into dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head sync/main-into-dev-${{ github.run_id }} \
            --title "chore: sync main into dev after v${{ needs.release.outputs.version }}" \
            --body "Automated sync of \`main\` into \`dev\` after release v${{ needs.release.outputs.version }}."
