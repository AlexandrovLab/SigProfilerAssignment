[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/), and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]

"""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | trim_end_matches(pat=":") }}
{% for commit in commits %}
- {{ commit.message | split(pat="\\n") | first | trim }}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
filter_commits = true

commit_parsers = [
  { message = "(?i)^merge ", skip = true },
  { message = "(?i)^revert", skip = true },
  { message = "(?i)^(feat|feature|add|added)(\\(.*\\))?:?\\b", group = "Added" },
  { message = "(?i)^(fix|fixed|bugfix|resolve[sd]?)(\\(.*\\))?:?\\b", group = "Fixed" },
  { message = "(?i)^(chore|ci)(\\(.*\\))?:?\\s", skip = true },
  { message = ".*", group = "Changed" },
]
